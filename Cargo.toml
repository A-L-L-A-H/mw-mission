[package]
name = "mw-mission"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "MoonWitness Server-Class Rust Distributed Job, DAG, Cron & Outbox Queue Broker"
license = "AGPL-3.0-only"
repository = "https://github.com/A-L-L-A-H/mw-mission"

[lib]
name = "mw_mission"
path = "src/lib.rs"

[[bin]]
name = "mw-mission"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.16", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.19"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
